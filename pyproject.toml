[project]
name = "coral"
version = "0.4.3"
description = "Coral is an AI agent, originally from TitanOS Nebula. It has migrated into a standalone agent, including integrations with other platforms."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alive-progress>=3.3.0",
    "apscheduler<4",
    "ddgs>=9.11.4",
    "discord-py>=2.7.1",
    "httpx>=0.28.1",
    "httpx2>=2.13.1",
    "jinja2>=3.1.6",
    "pydantic>=2.12.5",
    "pydantic-ai>=2.57.0,<2.58",
    "pydantic-ai-harness[prompt-injection-defender]>=0.57.0,<0.58",
    "pydantic-ai-slim[web-fetch]>=2.57.0,<2.58",
    "pyyaml>=6.0.3",
    "sqlmodel>=0.0.37",
    "typer>=0.24.1",
]

[project.scripts]
coral = "coral.main:app"
